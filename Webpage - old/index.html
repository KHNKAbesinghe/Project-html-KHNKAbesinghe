<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home - CanDo</title>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">CanDo</a>
      <nav class="nav">
        <a class="active" href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-media">
          <img src="img/p1.png" alt="Colorful silicone phone cases"/>
        </div>
        <div class="hero-text">
          <h1>Accessories that make your tech effortless.</h1>
          <a class="btn" href="products.html">Shop accessories</a>
          <div class="badges">
            <span class="badge">Fast setup</span>
            <span class="badge">No JavaScript</span>
            <span class="badge">Responsive</span>
          </div>
        </div>
      </div>
    </section>

    <section class="container section">
      <h2 class="section-title">Featured</h2>
      <div class="products-grid">
        <article class="card product-mini">
          <figure><img src="img/p2.png" alt="Car Mount Holder"></figure>
          <div class="body">
            <h3>Car Mount Holder</h3>
            <p class="price">€19</p>
            <a class="btn wide" href="products.html">Buy</a>
          </div>
        </article>

        <article class="card product-mini">
          <figure><img src="img/p3.png" alt="PopGrip Suction Case"></figure>
          <div class="body">
            <h3>PopGrip Suction Case</h3>
            <p class="price">€14</p>
            <a class="btn wide" href="products.html">Buy</a>
          </div>
        </article>

        <article class="card product-mini">
          <figure><img src="img/p4.png" alt="Multi USB Charging Cable"></figure>
          <div class="body">
            <h3>Multi USB Charging Cable</h3>
            <p class="price">€24</p>
            <a class="btn wide" href="products.html">Buy</a>
          </div>
        </article>

        <article class="card product-mini">
          <figure><img src="img/p5.png" alt="Tripod Phone Stand"></figure>
          <div class="body">
            <h3>Tripod Phone Stand</h3>
            <p class="price">€29</p>
            <a class="btn wide" href="products.html">Buy</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 CanDo. Educational project.</p>
    </div>
  </footer>
</body>
</html>
