<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - CanDo</title>
  <link href="style.css" rel="stylesheet"/>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">CanDo</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container contact-main">
    <h1>Contact</h1>
    <section class="contact-grid">
      <div class="panel">
        <h2 class="section-title" style="margin-top:0">Get in touch</h2>
        <ul class="contact-list">
          <li><span class="label">Email</span><span class="value">kapugeda@metropolia.fi</span></li>
          <li><span class="label">Phone</span><span class="value">+358449506173</span></li>
          <li><span class="label">Address</span><span class="value">Espoo, Finland</span></li>
        </ul>

      </div>

      <div class="panel">
        <div class="map-embed">
          <iframe
            title="Espoo, Finland"
            src="https://www.google.com/maps?q=Espoo%2C%20Finland&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2025 CanDo. Educational project.</p>
    </div>
  </footer>
</body>
</html>
